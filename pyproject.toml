[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizador-sep"
version = "1.7.0"
description = "Analizador de Sistemas de Potencia (portado de MATLAB a Python)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "customtkinter>=5.2",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[project.scripts]
analizador = "analizador.cli.console:main"
analizador-gui = "analizador.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = false
# Módulos propios — comprobamos lo que podemos sin forzar stubs de numpy
[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "matplotlib.*", "customtkinter.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["analizador"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
