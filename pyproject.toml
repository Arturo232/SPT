[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizador-sep"
version = "1.0.0"
description = "Analizador de Sistemas de Potencia (portado de MATLAB a Python)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
analizador = "analizador.main:main"
analizador-gui = "analizador.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
